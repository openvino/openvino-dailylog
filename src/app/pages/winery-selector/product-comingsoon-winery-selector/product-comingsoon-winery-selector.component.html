<div class="card">
  <div class="card-body">
    <div class="card bg-dark text-white">
      <img class="card-img" [src]="product.image ? product.image : '../../../../assets/images/placeholder_comingsoon.jpg'" alt="{{product.name}}">
      <div class="card-img-overlay">
        <p>{{"wineries.coming-soon" | translate}}</p>
      </div>
    </div>
    <h5 class="card-title" style="color: var(--primary-text-color)">{{product.name}}</h5>
  </div>
</div>
